spring.application.name=counter

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional: Show SQL in console
spring.jpa.show-sql=true
spring.sql.init.mode=always

logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG
logging.level.com.zaxxer.hikari=INFO

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.continue-on-error=true
spring.jpa.properties.hibernate.format_sql=true

# JDBC and Hibernate logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: Debug connection pool and auto-configuration
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG
logging.level.com.zaxxer.hikari=INFO

# Disable schema auto-generation
spring.jpa.hibernate.ddl-auto=none

# Run schema.sql/data.sql at startup if present
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.access-minutes=30
security.jwt.refresh-days=1

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

cookie.domain=${COOKIE_DOMAIN}


# Agent Service Configuration
agent.service.url=${AGENT_SERVICE_URL}
